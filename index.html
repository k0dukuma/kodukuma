  <script>
    const img = new Image();
    img.onload = () => {
      const canvas = document.getElementById('logo');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const pixels = frame.data;
      for (let i = 0; i < pixels.length; i += 4) {
        // Algse faili taust on RGB 162,187,146; valged jooned jäävad muutmata.
        const strength = Math.max(0, Math.min(1, (pixels[i] - 162) / 93));
        pixels[i] = pixels[i + 1] = pixels[i + 2] = 255;
        pixels[i + 3] = Math.round(255 * strength);
      }
      ctx.putImageData(frame, 0, 0);
      canvas.hidden = false;
      document.getElementById('source-logo').hidden = true;
    };
    img.src = document.getElementById('source-logo').src;
